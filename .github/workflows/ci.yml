name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      # O Google Chrome de marca (137+) ignora --load-extension; o Chromium do Playwright aceita.
      - name: Instalar Chromium (Playwright)
        run: npx playwright-core install --with-deps chromium
      - name: End-to-end (Chromium real com a extensão carregada)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: dist/*.zip
