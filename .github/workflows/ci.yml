name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - name: End-to-end (Chrome real com a extensão carregada)
        run: CHROMIUM_PATH="$(which google-chrome)" npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: dist/*.zip
